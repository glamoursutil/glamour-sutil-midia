<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Glamour Sutil — Autorização Instagram</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f9ecec; color: #4a2f22; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; }
  .ok { color: #2e7d32; font-weight: bold; }
  .erro { color: #c62828; font-weight: bold; }
  pre { background: #fff; border: 1px solid #e0c9b8; border-radius: 8px; padding: 16px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  button { background: #7a5a44; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
  <h1>Glamour Sutil — Autorização Instagram</h1>
  <div id="resultado">Lendo parâmetros da URL...</div>
  <p>Copie o bloco abaixo e cole no PowerShell:</p>
  <pre id="comando"></pre>
  <button onclick="copiar()">Copiar comando</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const erro = params.get("error_description") || params.get("error");
    const resultado = document.getElementById("resultado");
    const comandoEl = document.getElementById("comando");

    if (code) {
      resultado.innerHTML = '<p class="ok">Autorizado com sucesso!</p><p>code: ' + code + '</p>';
      const cmd = 'cd "C:\\Users\\Arthur e Elis\\source\\repos\\shopee-automation"; python src\\instagram_oauth.py finish ' + code;
      comandoEl.textContent = cmd;
    } else {
      resultado.innerHTML = '<p class="erro">Não veio code na URL. ' + (erro || window.location.search) + '</p>';
      comandoEl.textContent = "(nada pra copiar)";
    }

    function copiar() {
      navigator.clipboard.writeText(comandoEl.textContent);
    }
  </script>
</body>
</html>
